name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
      POSTMAN_COLLECTION_ID: ${{ vars.POSTMAN_COLLECTION_ID }}
      POSTMAN_ENVIRONMENT_ID: ${{ vars.POSTMAN_ENVIRONMENT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -fsSL https://dl-cli.pstmn.io/install/linux64.sh | sh

      - name: Verify Postman API key
        run: |
          if [ -z "${POSTMAN_API_KEY}" ]; then
            echo "Missing GitHub secret POSTMAN_API_KEY"
            exit 1
          fi

      - name: Login to Postman
        run: |
          postman login --with-api-key "${POSTMAN_API_KEY}"

      - name: Run Postman collection
        run: |
          if [ -n "${POSTMAN_COLLECTION_ID}" ]; then
            if [ -n "${POSTMAN_ENVIRONMENT_ID}" ]; then
              postman collection run "${POSTMAN_COLLECTION_ID}" --environment "${POSTMAN_ENVIRONMENT_ID}" --reporters cli
            else
              postman collection run "${POSTMAN_COLLECTION_ID}" --reporters cli
            fi
          else
            echo "Missing Postman Collection ID. Set the variable POSTMAN_COLLECTION_ID."
            exit 1
          fi
