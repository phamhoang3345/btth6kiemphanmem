name: Production Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          echo "$HOME/.postman" >> "$GITHUB_PATH"

      - name: Login to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        if: ${{ secrets.POSTMAN_API_KEY != '' }}
        run: |
          postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Run monitored Postman collection
        env:
          POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
        if: ${{ secrets.POSTMAN_API_KEY != '' && secrets.POSTMAN_COLLECTION_ID != '' }}
        run: |
          postman collection run "$POSTMAN_COLLECTION_ID" --reporter cli
